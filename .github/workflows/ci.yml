name: CI

on:
  push:
    branches:
      - main
    paths: &paths
      - "mcp/**"
      - "backend/**"
      - "frontend/**"
      - "frontend-react/**"
      - "docs/openapi.json"
  pull_request:
    paths: *paths

jobs:
  # Detect which parts of the codebase changed
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      frontend_react: ${{ steps.filter.outputs.frontend_react }}
      mcp: ${{ steps.filter.outputs.mcp }}
      openapi: ${{ steps.filter.outputs.openapi }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            frontend_react:
              - 'frontend-react/**'
            mcp:
              - 'mcp/**'
            openapi:
              - 'docs/openapi.json'
  backend-build:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        working-directory: backend
        run: uv sync

  backend-code-quality:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group code-quality --extra otel
      - name: Run linter
        working-directory: backend
        run: uv run ruff check
      - name: Run formatter
        working-directory: backend
        run: uv run ruff format --check
      - name: Run type checker
        working-directory: backend
        run: uv run ty check

  backend-openapi-spec:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.openapi == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        working-directory: backend
        run: uv sync
      - name: Check docs/openapi.json is up to date
        working-directory: backend
        env:
          SECRET_KEY: ci-only-secret-key
        run: uv run python scripts/export_openapi.py --check

  backend-test:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: open-wearables
          POSTGRES_PASSWORD: open-wearables
          POSTGRES_DB: open_wearables_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://open-wearables:open-wearables@localhost:5432/open_wearables_test
      TEST_REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci
      MASTER_KEY: dGVzdC1tYXN0ZXIta2V5LWZvci10ZXN0aW5nLW9ubHk=
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev --extra otel
      - name: Run tests with coverage
        working-directory: backend
        run: uv run pytest -v --cov=app --cov-report=xml --cov-report=term-missing
      - name: Run OpenTelemetry tests without the otel extra
        working-directory: backend
        run: |
          uv sync --group dev
          uv run pytest -v tests/utils_tests/test_otel_wiring.py tests/utils_tests/test_otel_export.py

  backend-migrations:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        working-directory: backend
        run: uv sync
      - name: Check migration chain
        working-directory: backend
        run: uv run python scripts/check_migrations.py --base origin/${{ github.base_ref || 'main' }}

  mcp-build:
    needs: changes
    if: ${{ needs.changes.outputs.mcp == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        working-directory: mcp
        run: uv sync

  mcp-code-quality:
    needs: changes
    if: ${{ needs.changes.outputs.mcp == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        working-directory: mcp
        run: uv sync --group code-quality
      - name: Run linter
        working-directory: mcp
        run: uv run ruff check
      - name: Run formatter
        working-directory: mcp
        run: uv run ruff format --check
      - name: Run type checker
        working-directory: mcp
        run: uv run ty check

  mcp-test:
    needs: changes
    if: ${{ needs.changes.outputs.mcp == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        working-directory: mcp
        run: uv sync --group dev
      - name: Run tests
        working-directory: mcp
        run: uv run pytest -v

  frontend-build:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Type check
        working-directory: frontend
        run: bun run check
      - name: Build application
        working-directory: frontend
        run: bun run build

  frontend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Run eslint
        working-directory: frontend
        run: bun run lint

  frontend-format-check:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Run prettier check
        working-directory: frontend
        run: bun run format:check

  frontend-test:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      # Component tests run in a real Chromium too, not only e2e.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: Install Playwright Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Unit and component tests
        working-directory: frontend
        run: bun run test:unit --run
      - name: End-to-end tests
        working-directory: frontend
        run: bunx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # The fork's React dashboard, served until its screens are ported to the
  # SvelteKit portal above. See docs/fork/DECISIONS.md.
  frontend-react-setup:
    needs: changes
    if: ${{ needs.changes.outputs.frontend_react == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend-react/pnpm-lock.yaml
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: frontend-react/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend-react/pnpm-lock.yaml') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: frontend-react
        run: pnpm install --frozen-lockfile

  frontend-react-build:
    needs: [changes, frontend-react-setup]
    if: ${{ needs.changes.outputs.frontend_react == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: frontend-react/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend-react/pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - name: Build application
        working-directory: frontend-react
        run: pnpm run build

  frontend-react-lint:
    needs: [changes, frontend-react-setup]
    if: ${{ needs.changes.outputs.frontend_react == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: frontend-react/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend-react/pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - name: Run oxlint
        working-directory: frontend-react
        run: pnpm run lint

  frontend-react-format-check:
    needs: [changes, frontend-react-setup]
    if: ${{ needs.changes.outputs.frontend_react == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: frontend-react/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend-react/pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - name: Run prettier check
        working-directory: frontend-react
        run: pnpm run format:check
