# Add each of these filenames to the `resources:` list in the Flux repo's
# production/kustomization.yaml - that file, not this one, is what the cluster
# reconciles. This copy exists so the set is reviewable in the app repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: PLACEHOLDER_NAMESPACE

resources:
  - config.yaml
  # - secrets.yaml      # your real secret, named whatever Container Services advises
  - redis.yaml
  - api.yaml
  - frontend.yaml
  - workers.yaml
