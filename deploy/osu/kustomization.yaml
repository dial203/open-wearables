apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set by OTDI when they provision the project.
namespace: REPLACE-WITH-YOUR-NAMESPACE

commonLabels:
  app.kubernetes.io/part-of: open-wearables

resources:
  - configmap.yaml
  - redis.yaml
  - api.yaml
  - worker.yaml
  - beat.yaml
  - frontend.yaml
  - ingress.yaml

# ow-secrets is created out-of-band from an .env file that is never committed:
#   kubectl create secret generic ow-secrets --from-env-file=secrets.env
# See README.md.

images:
  - name: themomentum/open-wearables-backend
    newTag: "0.7.0"
  - name: themomentum/open-wearables-frontend
    newTag: "0.7.0"
