apiVersion: apps/v1
kind: Deployment
metadata:
  name: ow-beat
spec:
  # Exactly one beat process, or every scheduled sync fires twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ow-beat
  template:
    metadata:
      labels:
        app: ow-beat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: beat
          image: themomentum/open-wearables-backend:0.7.0
          # scripts/start/beat.sh writes celerybeat.pid and the schedule file
          # into the image's working directory, which a non-root uid cannot
          # write to. Run celery directly with both paths under /tmp instead.
          command:
            - celery
            - -A
            - app.main:celery_app
            - beat
            - -l
            - info
            - --pidfile=/tmp/celerybeat.pid
            - --schedule=/tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: ow-config
            - secretRef:
                name: ow-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
