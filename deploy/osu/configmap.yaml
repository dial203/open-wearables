# Non-secret runtime configuration. Everything sensitive (DB_PASSWORD,
# SECRET_KEY, ADMIN_PASSWORD, provider client secrets) goes in the `ow-secrets`
# Secret instead - see README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ow-config
data:
  ENVIRONMENT: "production"

  # Managed PostgreSQL from OTDI. Replace with the host the DBA team gives you.
  DB_HOST: "REPLACE.db.osu.edu"
  DB_PORT: "5432"
  DB_NAME: "open_wearables"
  DB_USER: "open_wearables"

  # In-cluster Redis (redis.yaml).
  REDIS_HOST: "ow-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_SSL: "false"

  # Public URLs. These must match the ingress hosts in ingress.yaml.
  FRONTEND_URL: "https://wearables.osu.edu"
  API_BASE_URL: "https://wearables-api.osu.edu"
  VITE_API_URL: "https://wearables-api.osu.edu"
  CORS_ORIGINS: '["https://wearables.osu.edu"]'

  ADMIN_EMAIL: "dial.47@osu.edu"

  # Svix is not deployed here, so outgoing webhooks stay off. Turning them on
  # requires a second database named `svix` and a svix-server Deployment.
  OUTGOING_WEBHOOKS_ENABLED: "false"

  # The images run `uv run ...`; uv wants a writable cache and HOME. Under a
  # restricted PodSecurity namespace the container runs as a uid with no home
  # directory, so point both at the emptyDir mounted on /tmp.
  HOME: "/tmp"
  UV_CACHE_DIR: "/tmp/uv-cache"
