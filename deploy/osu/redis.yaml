# Celery broker.
#
# Storage is deliberately ephemeral (emptyDir). The only persistent storage on
# this platform is NFS-backed, and Redis append-only persistence on NFS is a
# known source of corruption and fsync stalls. The tradeoff: a pod restart
# drops queued tasks. For Open Wearables that means a missed sync cycle, which
# the next celery-beat tick re-queues - acceptable for scheduled syncs, less so
# if you depend on inbound provider webhooks during the restart window.
#
# If you need a durable broker, ask Container Services whether block-backed
# storage is available before switching to a PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ow-redis
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: ow-redis
    middleware.ocio.osu.edu/billing: PLACEHOLDER_NAMESPACE
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ow-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ow-redis
    spec:
      restartPolicy: Always
      containers:
        - name: redis
          image: redis:8
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          securityContext:
            runAsUser: 999
            allowPrivilegeEscalation: false
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ow-redis
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: ow-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: ow-redis
