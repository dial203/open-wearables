apiVersion: v1
kind: Service
metadata:
  name: ow-frontend
spec:
  selector:
    app: ow-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ow-frontend
  template:
    metadata:
      labels:
        app: ow-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: themomentum/open-wearables-frontend:0.7.0
          env:
            # Read at request time by the Nitro server and injected into the
            # HTML, so this is the URL the browser uses - not an in-cluster one.
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: ow-config
                  key: VITE_API_URL
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
