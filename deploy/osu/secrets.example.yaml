# Template only - DO NOT commit real values under this name.
#
# Container Services is GitOps: whatever you commit to the Flux repository is
# what runs. A Kubernetes Secret is base64, which is encoding, not encryption -
# anyone who can read the Flux repository can read these values, and the repo
# has a full history, so a rotated secret stays readable forever.
#
# For an S4 deployment that is a finding waiting to happen. Before committing
# anything real, ask Container Services which of these they support:
#   - Sealed Secrets or SOPS/age (encrypted at rest in Git, decrypted in-cluster)
#   - External Secrets Operator pointed at a university secret store
#   - A Secret they create directly in the namespace, out of band, that your
#     Deployment only references by name
#
# Encode a value with: echo -n 'value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: ow-secrets
  namespace: PLACEHOLDER_NAMESPACE
type: Opaque
data:
  # Core
  DB_PASSWORD: QkFTRTY0X01F
  SECRET_KEY: QkFTRTY0X01F
  ADMIN_PASSWORD: QkFTRTY0X01F
  OPEN_WEARABLES_API_KEY: QkFTRTY0X01F

  # Transactional email (invitations, password resets)
  RESEND_API_KEY: QkFTRTY0X01F

  # One pair per provider you enable. Delete the ones you do not use -
  # every unused credential in here is extra audit surface.
  GARMIN_CLIENT_ID: QkFTRTY0X01F
  GARMIN_CLIENT_SECRET: QkFTRTY0X01F
  WHOOP_CLIENT_ID: QkFTRTY0X01F
  WHOOP_CLIENT_SECRET: QkFTRTY0X01F
  OURA_CLIENT_ID: QkFTRTY0X01F
  OURA_CLIENT_SECRET: QkFTRTY0X01F
  POLAR_CLIENT_ID: QkFTRTY0X01F
  POLAR_CLIENT_SECRET: QkFTRTY0X01F
  FITBIT_CLIENT_ID: QkFTRTY0X01F
  FITBIT_CLIENT_SECRET: QkFTRTY0X01F
