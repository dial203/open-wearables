apiVersion: apps/v1
kind: Deployment
metadata:
  name: ow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ow-worker
  template:
    metadata:
      labels:
        app: ow-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: themomentum/open-wearables-backend:0.7.0
          command: ["scripts/start/worker.sh"]
          envFrom:
            - configMapRef:
                name: ow-config
            - secretRef:
                name: ow-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # worker.sh starts an I/O worker and a CPU worker in one container;
          # `celery inspect ping` covers both.
          readinessProbe:
            exec:
              command: ["sh", "-c", "celery -A app.main:celery_app inspect ping -d io@$HOSTNAME"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Apple Health XML imports are the memory-hungry path. Raise this
              # if you see OOMKills on the xml_sync queue.
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
